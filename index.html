<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>¡Feliz Cumpleaños, Carlos Salazar! - Equipo Cognitive</title>
    <!-- Tailwind CSS para diseño responsivo y utilidades -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Great Vibes para encabezados festivos e Inter para controles limpios -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Configuración de tipografía y estilos base */
        body {
            height: 100vh;
            height: 100dvh;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #050814 70%, #02040a 100%);
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .safe-area-bottom {
            padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px));
        }

        @media (min-width: 640px) {
            .safe-area-bottom {
                padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));
            }
        }

        .font-festive {
            font-family: 'Great Vibes', cursive;
        }

        /* Lienzo de fuegos artificiales a pantalla completa */
        #fireworksCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Lienzo de confeti dorado flotante */
        #confettiCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
        }

        /* Animación de entrada y salida del texto de introducción */
        @keyframes introPulse {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(15px);
                filter: blur(6px);
            }
            20% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
            80% {
                opacity: 1;
                transform: scale(1.03) translateY(-4px);
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: scale(1.08) translateY(-15px);
                filter: blur(8px);
            }
        }

        .animate-intro {
            animation: introPulse 4.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Contenedor con perspectiva 3D para la tarjeta */
        .card-perspective {
            perspective: 1400px;
        }

        /* Animación cinemática 3D de entrada de la tarjeta */
        .card-wrapper {
            opacity: 0;
            transform: translateY(60px) scale(0.72) rotateX(18deg) rotateY(-10deg);
            transition: transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.1s ease-out;
            transform-style: preserve-3d;
            will-change: transform, opacity;
        }

        .card-wrapper.visible {
            opacity: 1;
            transform: translateY(0) scale(1) rotateX(0deg) rotateY(0deg);
        }

        /* Flotación suave continua una vez que la tarjeta está en escena */
        @keyframes gentleFloat {
            0%, 100% {
                transform: translateY(0px) rotateZ(0deg);
            }
            50% {
                transform: translateY(-7px) rotateZ(0.4deg);
            }
        }

        .card-floating {
            animation: gentleFloat 5s ease-in-out infinite;
        }

        /* Efecto de brillo (shimmer) diagonal periódico sobre la tarjeta */
        .shimmer-overlay {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            pointer-events: none;
            z-index: 20;
        }

        .shimmer-overlay::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -120%;
            width: 70%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 248, 220, 0.35) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(25deg);
            animation: shimmerSweep 5.5s ease-in-out infinite;
        }

        @keyframes shimmerSweep {
            0%, 45% {
                left: -120%;
            }
            75%, 100% {
                left: 160%;
            }
        }

        /* Resplandor dorado detrás de la tarjeta */
        .card-glow {
            box-shadow:
                0 25px 60px -15px rgba(0, 0, 0, 0.85),
                0 0 35px rgba(251, 191, 36, 0.25),
                0 0 70px rgba(245, 158, 11, 0.12);
        }

        /* Barra de progreso tipo reproductor de video */
        .progress-bar-fill {
            transition: width 0.25s linear;
        }
    </style>
</head>
<body class="w-screen flex flex-col justify-between items-center relative text-white">

    <!-- Lienzo principal de fuegos artificiales -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- Lienzo secundario para confeti dorado -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Brillo ambiental superior sutil -->
    <div class="fixed top-0 inset-x-0 h-32 bg-gradient-to-b from-amber-500/10 to-transparent pointer-events-none z-0"></div>

    <!-- Encabezado discreto tipo presentación -->
    <header class="relative z-20 w-full max-w-4xl px-4 pt-4 sm:pt-5 flex justify-between items-center opacity-80">
        <div class="flex items-center gap-2 bg-slate-900/50 backdrop-blur-md border border-white/10 px-3 py-1.5 rounded-full text-xs sm:text-sm text-amber-200/90">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            <span>Equipo Cognitive • Celebración Especial</span>
        </div>
        <button id="tapBurstHint" class="hidden sm:inline-flex items-center gap-1.5 bg-slate-900/50 backdrop-blur-md border border-white/10 px-3 py-1.5 rounded-full text-xs text-slate-300 hover:text-white hover:border-amber-400/40 transition cursor-pointer">
            <span>✨ Haz clic en el cielo para lanzar fuegos</span>
        </button>
    </header>

    <!-- Escenario Central: Texto Intro + Tarjeta de Cumpleaños -->
    <main id="stageArea" class="relative z-10 flex-1 w-full flex items-center justify-center px-4 py-2 overflow-hidden">
        
        <!-- Fase 1: Introducción cinemática sobre el cielo nocturno -->
        <div id="introOverlay" class="absolute inset-0 flex flex-col items-center justify-center text-center px-6 pointer-events-none">
            <p class="text-amber-300 uppercase tracking-[0.25em] text-xs sm:text-sm font-semibold mb-3 drop-shadow">

            </p>
            <h1 class="font-festive text-4xl sm:text-6xl md:text-7xl text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-100 to-amber-300 drop-shadow-[0_4px_20px_rgba(251,191,36,0.45)] leading-tight">
                ¡Hoy celebramos a alguien muy especial!

            <div class="mt-5 flex items-center gap-2 text-amber-200/80 text-sm">

<!-- Fase 2: Tarjeta de felicitación con entrada 3D -->
        <div class="card-perspective flex items-center justify-center w-full h-full">
            <div id="cardContainer" class="card-wrapper relative max-h-[50dvh] sm:max-h-[74vh] max-w-full aspect-[3/4] rounded-2xl sm:rounded-3xl p-1.5 bg-gradient-to-br from-amber-300/70 via-yellow-500/40 to-amber-600/70 card-glow">
                <!-- Capa interna de la tarjeta -->
                <div class="relative w-full h-full rounded-[14px] sm:rounded-[20px] overflow-hidden bg-[#fdf6e7] flex items-center justify-center">
                    <!-- Imagen principal de la tarjeta generada -->
                    <img

                    <div class="shimmer-overlay"></div>

    <!-- Controles tipo reproductor de video en la parte inferior -->
    <footer aria-label="Controles de la presentación" class="relative z-20 w-full max-w-xl px-3 sm:px-4 pt-2 pb-5 sm:pb-6 shrink-0">
        <div class="bg-slate-900/75 backdrop-blur-xl border border-white/15 rounded-2xl p-3 sm:p-3.5 shadow-2xl">

            <div class="w-full h-1.5 bg-slate-700/80 rounded-full overflow-hidden mb-3">

            <!-- Botonera de controles -->
            <div class="flex items-center justify-between gap-1 sm:gap-2">

                <button

                    <svg class="w-4 h-4 shrink-0 text-amber-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>

                <!-- Botón Pausar / Reanudar Fuegos -->
                <button

                    aria-pressed="false"

                    title="Pausar o reanudar fuegos artificiales"
                >
                    <svg id="pauseIcon" class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 24 24">

                <!-- Botón Música / Campanillas Celebratorias (Web Audio API) -->
                <button
                    id="musicBtn"
                    type="button"
                    aria-pressed="false"
                    class="min-w-0 min-h-11 flex-1 sm:flex-none inline-flex items-center justify-center gap-1 sm:gap-2 px-1.5 sm:px-3.5 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 active:scale-95 text-[11px] sm:text-sm font-semibold text-slate-950 shadow-lg shadow-amber-500/25 transition cursor-pointer whitespace-nowrap"
                    title="Activar o silenciar melodía de cumpleaños"
                >
                    <svg id="soundOffIcon" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                    </svg>
                    <svg id="soundOnIcon" class="w-4 h-4 shrink-0 hidden" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                    <span id="musicText">Música</span>
                </button>
            </div>
        </div>
    </footer>

    <script>
        /**
         * Configuración y control de la presentación tipo video
         */
        const fireworksCanvas = document.getElementById('fireworksCanvas');
        const fwCtx = fireworksCanvas.getContext('2d');
        const confettiCanvas = document.getElementById('confettiCanvas');
        const cfCtx = confettiCanvas.getContext('2d');

        const introOverlay = document.getElementById('introOverlay');
        const cardContainer = document.getElementById('cardContainer');
        const birthdayCardImg = document.getElementById('birthdayCardImg');
        const videoProgress = document.getElementById('videoProgress');

        const replayBtn = document.getElementById('replayBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const pauseIcon = document.getElementById('pauseIcon');
        const playIcon = document.getElementById('playIcon');
        const playPauseText = document.getElementById('playPauseText');

        const musicBtn = document.getElementById('musicBtn');
        const soundOffIcon = document.getElementById('soundOffIcon');
        const soundOnIcon = document.getElementById('soundOnIcon');
        const musicText = document.getElementById('musicText');

        // Fallback elegante en SVG data URI por si el entorno no encuentra el archivo local
        birthdayCardImg.onerror = function () {
            const fallbackSvg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
                    <defs>
                        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#fff8e7"/>
                            <stop offset="100%" stop-color="#f7e6c4"/>
                        </linearGradient>
                    </defs>
                    <rect width="600" height="800" fill="url(#bg)" rx="24"/>
                    <rect x="24" y="24" width="552" height="752" fill="none" stroke="#d4a359" stroke-width="3" rx="18"/>
                    <text x="300" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#5c2d16">¡Feliz Cumpleaños,</text>
                    <text x="300" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#5c2d16">Carlos Salazar!</text>
                    <text x="300" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2b1d14">En este día especial, te envío</text>
                    <text x="300" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2b1d14">mis mejores deseos de éxito,</text>
                    <text x="300" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2b1d14">salud y bienestar. Que este</text>
                    <text x="300" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2b1d14">nuevo año venga cargado de</text>
                    <text x="300" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2b1d14">grandes oportunidades y</text>
                    <text x="300" y="505" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2b1d14">momentos memorables.</text>
                    <text x="300" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#5c2d16">¡Muchas felicidades!</text>
                    <text x="300" y="705" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#3d2817">Atentamente,</text>
                    <text x="300" y="735" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#3d2817">Equipo Cognitive</text>
                </svg>
            `;
            this.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(fallbackSvg);
        };

        // Variables de estado de la animación
        let width = 0;
        let height = 0;
        let isPaused = false;
        let cardRevealed = false;
        let presentationStartTime = performance.now();
        const INTRO_DURATION_MS = 3800; // 3.8 segundos de fuegos + intro antes de mostrar la tarjeta
        const TOTAL_TIMELINE_MS = 14000; // Duración de referencia de la barra de progreso

        let rockets = [];
        let particles = [];
        let stars = [];
        let confettiPieces = [];
        let lastLaunchTime = 0;

        /**
         * Ajuste responsivo de los lienzos (Canvas) y generación de estrellas de fondo
         */
        function resizeCanvases() {
            width = window.innerWidth;
            height = window.innerHeight;
            fireworksCanvas.width = width;
            fireworksCanvas.height = height;
            confettiCanvas.width = width;
            confettiCanvas.height = height;
            initStars();
        }

        function initStars() {
            stars = [];
            const starCount = Math.min(120, Math.floor((width * height) / 11000));
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height * 0.85,
                    radius: Math.random() * 1.4 + 0.3,
                    alpha: Math.random() * 0.7 + 0.2,
                    twinkleSpeed: Math.random() * 0.02 + 0.005,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        /**
         * Paletas de colores vibrantes y festivos para los fuegos artificiales
         */
        const FIREWORK_PALETTES = [
            ['#fbbf24', '#f59e0b', '#fef08a', '#ffffff'], // Dorado imperial
            ['#f43f5e', '#fb7185', '#fda4af', '#fde047'], // Rosa festivo y oro
            ['#38bdf8', '#818cf8', '#c084fc', '#e0f2fe'], // Azul cielo y lavanda
            ['#34d399', '#6ee7b7', '#fcd34d', '#ffffff'], // Esmeralda y destellos
            ['#fb923c', '#f87171', '#facc15', '#fffbeb']  // Cálido atardecer
        ];

        /**
         * Clase Rocket: Cohete ascendente con estela luminosa
         */
        class Rocket {
            constructor(startX, targetX, targetY) {
                this.x = startX ?? (width * 0.15 + Math.random() * width * 0.7);
                this.y = height + 10;
                this.targetX = targetX ?? (this.x + (Math.random() - 0.5) * 160);
                this.targetY = targetY ?? (height * 0.14 + Math.random() * height * 0.34);

                const angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
                const speed = 9 + Math.random() * 3.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;

                this.palette = FIREWORK_PALETTES[Math.floor(Math.random() * FIREWORK_PALETTES.length)];
                this.color = this.palette[0];
                this.trail = [];
                this.exploded = false;
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 10) this.trail.shift();

                this.x += this.vx;
                this.y += this.vy;
                // Desaceleración gradual por gravedad
                this.vy += 0.08;

                // Detonar al alcanzar la altura objetivo o perder impulso ascendente
                if (this.y <= this.targetY || this.vy >= -1.2) {
                    this.explode();
                    this.exploded = true;
                }
            }

            draw(ctx) {
                ctx.save();
                for (let i = 0; i < this.trail.length; i++) {
                    const point = this.trail[i];
                    const progress = i / this.trail.length;
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, progress * 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = progress * 0.7;
                    ctx.fill();
                }

                // Punta brillante del cohete
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = 1;
                ctx.fill();
                ctx.restore();
            }

            explode() {
                const isBigBurst = !cardRevealed || Math.random() > 0.45;
                const count = isBigBurst ? 75 : 48;
                const burstType = Math.random();

                for (let i = 0; i < count; i++) {
                    let angle, speed;
                    if (burstType < 0.25) {
                        // Explosión en anillo perfecto
                        angle = (Math.PI * 2 * i) / count;
                        speed = 4.5 + Math.random() * 0.8;
                    } else {
                        // Explosión esférica orgánica
                        angle = Math.random() * Math.PI * 2;
                        speed = Math.pow(Math.random(), 0.55) * (isBigBurst ? 6.5 : 4.8);
                    }

                    const color = this.palette[Math.floor(Math.random() * this.palette.length)];
                    particles.push(new Particle(this.x, this.y, angle, speed, color));
                }

                // Destello sonoro sutil si la música está activa
                if (audioEnabled) {
                    playFireworkPop();
                }
            }
        }

        /**
         * Clase Particle: Chispa física con gravedad, fricción y estela brillante
         */
        class Particle {
            constructor(x, y, angle, speed, color) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = color;
                this.alpha = 1;
                this.decay = 0.012 + Math.random() * 0.012;
                this.gravity = 0.065;
                this.friction = 0.965;
                this.size = 1.8 + Math.random() * 1.8;
                this.history = [];
                this.twinkle = Math.random() > 0.5;
            }

            update() {
                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > 6) this.history.shift();

                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;

                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();

                // Dibujar estela suave
                if (this.history.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.history[0].x, this.history[0].y);
                    for (let i = 1; i < this.history.length; i++) {
                        ctx.lineTo(this.history[i].x, this.history[i].y);
                    }
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.size * 0.85;
                    ctx.globalAlpha = Math.max(0, this.alpha * 0.45);
                    ctx.stroke();
                }

                // Dibujar chispa principal con efecto parpadeo
                const flicker = this.twinkle ? (0.7 + Math.random() * 0.3) : 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.alpha * flicker);
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();

                ctx.restore();
            }
        }

        /**
         * Confeti dorado flotante alrededor de la tarjeta
         */
        function initConfetti() {
            confettiPieces = [];
            const count = width < 640 ? 45 : 75;
            const goldShades = ['#fde047', '#fbbf24', '#f59e0b', '#fef3c7', '#fb7185'];

            for (let i = 0; i < count; i++) {
                confettiPieces.push({
                    x: Math.random() * width,
                    y: Math.random() * height - height,
                    w: 6 + Math.random() * 6,
                    h: 4 + Math.random() * 4,
                    color: goldShades[Math.floor(Math.random() * goldShades.length)],
                    vy: 1.1 + Math.random() * 1.6,
                    vx: (Math.random() - 0.5) * 0.8,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 4,
                    wobble: Math.random() * Math.PI * 2
                });
            }
        }

        function updateAndDrawConfetti() {
            cfCtx.clearRect(0, 0, width, height);
            if (!cardRevealed) return;

            for (const c of confettiPieces) {
                c.wobble += 0.04;
                c.x += c.vx + Math.sin(c.wobble) * 0.5;
                c.y += c.vy;
                c.rotation += c.rotationSpeed;

                if (c.y > height + 20) {
                    c.y = -15;
                    c.x = Math.random() * width;
                }

                cfCtx.save();
                cfCtx.translate(c.x, c.y);
                cfCtx.rotate((c.rotation * Math.PI) / 180);
                cfCtx.fillStyle = c.color;
                cfCtx.globalAlpha = 0.85;
                cfCtx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
                cfCtx.restore();
            }
        }

        /**
         * Interacción: Lanzar un fuego artificial al tocar o hacer clic en el cielo
         */
        document.getElementById('stageArea').addEventListener('pointerdown', (e) => {
            // Evitar disparar si el toque fue directamente dentro de la tarjeta
            if (cardContainer.contains(e.target) && cardRevealed) return;
            rockets.push(new Rocket(e.clientX, e.clientX, e.clientY));
        });

        /**
         * Secuencia de presentación (Intro -> Revelación 3D de la Tarjeta)
         */
        function startPresentationSequence() {
            cardRevealed = false;
            presentationStartTime = performance.now();

            // Reiniciar estado visual de la tarjeta
            cardContainer.classList.remove('visible', 'card-floating');

            // Reiniciar animación del texto introductorio
            introOverlay.classList.remove('animate-intro');
            void introOverlay.offsetWidth; // Forzar reflow
            introOverlay.classList.add('animate-intro');

            // Salva inicial de 3 cohetes festivos
            rockets.push(new Rocket(width * 0.28, width * 0.28, height * 0.26));
            setTimeout(() => {
                if (!isPaused) rockets.push(new Rocket(width * 0.72, width * 0.72, height * 0.24));
            }, 350);
            setTimeout(() => {
                if (!isPaused) rockets.push(new Rocket(width * 0.5, width * 0.5, height * 0.2));
            }, 700);
        }

        function revealCard() {
            if (cardRevealed) return;
            cardRevealed = true;
            cardContainer.classList.add('visible');
            initConfetti();

            // Salva de celebración alrededor de la tarjeta al aparecer
            rockets.push(new Rocket(width * 0.18, width * 0.2, height * 0.22));
            rockets.push(new Rocket(width * 0.82, width * 0.8, height * 0.22));

            // Activar flotación suave después de terminar la transición 3D de entrada
            setTimeout(() => {
                if (cardRevealed) {
                    cardContainer.classList.add('card-floating');
                }
            }, 1450);
        }

        /**
         * Bucle principal de animación
         */
        function animate(now) {
            requestAnimationFrame(animate);
            if (isPaused) return;

            const elapsed = now - presentationStartTime;

            // Actualizar barra de progreso tipo video
            const progressPct = Math.min(100, (elapsed / TOTAL_TIMELINE_MS) * 100);
            videoProgress.style.width = `${progressPct}%`;

            // Transición cinemática a la tarjeta tras la intro
            if (!cardRevealed && elapsed >= INTRO_DURATION_MS) {
                revealCard();
            }

            // Fondo semi-transparente para generar estela suave en el cielo nocturno
            fwCtx.fillStyle = 'rgba(5, 8, 20, 0.22)';
            fwCtx.fillRect(0, 0, width, height);

            // Dibujar estrellas titilantes
            for (const s of stars) {
                s.phase += s.twinkleSpeed;
                const currentAlpha = s.alpha * (0.65 + 0.35 * Math.sin(s.phase));
                fwCtx.beginPath();
                fwCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                fwCtx.fillStyle = `rgba(255, 250, 235, ${currentAlpha})`;
                fwCtx.fill();
            }

            // Lanzamiento automático periódico de fuegos artificiales
            const launchInterval = cardRevealed ? 1350 : 650;
            if (now - lastLaunchTime > launchInterval) {
                rockets.push(new Rocket());
                lastLaunchTime = now;
            }

            // Actualizar y dibujar cohetes
            for (let i = rockets.length - 1; i >= 0; i--) {
                rockets[i].update();
                rockets[i].draw(fwCtx);
                if (rockets[i].exploded) {
                    rockets.splice(i, 1);
                }
            }

            // Actualizar y dibujar partículas de explosión
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(fwCtx);
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Actualizar y dibujar confeti dorado
            updateAndDrawConfetti();
        }

        /**
         * Sintetizador de Música Celebratoria ("Cumpleaños Feliz" en campanillas)
         * 100% Web Audio API, sin dependencias externas
         */
        let audioCtx = null;
        let audioEnabled = false;
        let melodyTimer = null;
        let noteIndex = 0;

        // Notas de "Cumpleaños Feliz" en Do Mayor (frecuencia en Hz y duración en ms)
        const BIRTHDAY_MELODY = [
            { freq: 261.63, dur: 320 }, // C4 - Cum-
            { freq: 261.63, dur: 220 }, // C4 - ple-
            { freq: 293.66, dur: 520 }, // D4 - a-
            { freq: 261.63, dur: 520 }, // C4 - ños
            { freq: 349.23, dur: 520 }, // F4 - fe-
            { freq: 329.63, dur: 950 }, // E4 - liz

            { freq: 261.63, dur: 320 }, // C4 - Cum-
            { freq: 261.63, dur: 220 }, // C4 - ple-
            { freq: 293.66, dur: 520 }, // D4 - a-
            { freq: 261.63, dur: 520 }, // C4 - ños
            { freq: 392.00, dur: 520 }, // G4 - fe-
            { freq: 349.23, dur: 950 }, // F4 - liz

            { freq: 261.63, dur: 320 }, // C4 - Cum-
            { freq: 261.63, dur: 220 }, // C4 - ple-
            { freq: 523.25, dur: 520 }, // C5 - a-
            { freq: 440.00, dur: 520 }, // A4 - ños
            { freq: 349.23, dur: 450 }, // F4 - Car-
            { freq: 329.63, dur: 450 }, // E4 - los
            { freq: 293.66, dur: 900 }, // D4 - ...

            { freq: 466.16, dur: 320 }, // Bb4 - Cum-
            { freq: 466.16, dur: 220 }, // Bb4 - ple-
            { freq: 440.00, dur: 520 }, // A4 - a-
            { freq: 349.23, dur: 520 }, // F4 - ños
            { freq: 392.00, dur: 520 }, // G4 - fe-
            { freq: 349.23, dur: 1100 } // F4 - liz
        ];

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playChimeNote(freq, durationMs) {
            if (!audioCtx || !audioEnabled) return;
            const now = audioCtx.currentTime;

            // Oscilador principal dulce (tipo celesta / caja musical)
            const osc = audioCtx.createOscillator();
            const overtone = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            // Armónico octava superior suave para brillo de campanilla
            overtone.type = 'triangle';
            overtone.frequency.setValueAtTime(freq * 2, now);

            const overtoneGain = audioCtx.createGain();
            overtoneGain.gain.setValueAtTime(0.06, now);
            overtoneGain.gain.exponentialRampToValueAtTime(0.001, now + (durationMs / 1000) * 0.8);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.16, now + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + (durationMs / 1000) + 0.25);

            osc.connect(gain);
            overtone.connect(overtoneGain);
            overtoneGain.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            overtone.start(now);
            osc.stop(now + (durationMs / 1000) + 0.3);
            overtone.stop(now + (durationMs / 1000) + 0.3);
        }

        function playFireworkPop() {
            if (!audioCtx || !audioEnabled) return;
            try {
                const now = audioCtx.currentTime;
                const bufferSize = audioCtx.sampleRate * 0.18;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.04));
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(420, now);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);
            } catch (e) {
                // Ignorar errores menores de audio en navegadores restringidos
            }
        }

        function scheduleNextNote() {
            if (!audioEnabled || isPaused) return;
            const note = BIRTHDAY_MELODY[noteIndex];
            playChimeNote(note.freq, note.dur);
            noteIndex = (noteIndex + 1) % BIRTHDAY_MELODY.length;

            const pauseBetweenPhrases = noteIndex === 0 ? 1200 : 60;
            melodyTimer = setTimeout(scheduleNextNote, note.dur + pauseBetweenPhrases);
        }

        function toggleMusic() {
            audioEnabled = !audioEnabled;
            musicBtn.setAttribute('aria-pressed', String(audioEnabled));
            if (audioEnabled) {
                initAudioContext();
                soundOffIcon.classList.add('hidden');
                soundOnIcon.classList.remove('hidden');
                musicText.textContent = 'Sonando';
                scheduleNextNote();
            } else {
                clearTimeout(melodyTimer);
                soundOnIcon.classList.add('hidden');
                soundOffIcon.classList.remove('hidden');
                musicText.textContent = 'Música';
            }
        }

        /**
         * Eventos de los botones de control
         */
        replayBtn.addEventListener('click', () => {
            if (isPaused) {
                isPaused = false;
                playPauseBtn.setAttribute('aria-pressed', 'false');
                pauseIcon.classList.remove('hidden');
                playIcon.classList.add('hidden');
                playPauseText.textContent = 'Pausar';
            }
            particles = [];
            rockets = [];
            noteIndex = 0;
            clearTimeout(melodyTimer);
            if (audioEnabled) {
                scheduleNextNote();
            }
            startPresentationSequence();
        });

        playPauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            playPauseBtn.setAttribute('aria-pressed', String(isPaused));
            if (isPaused) {
                pauseIcon.classList.add('hidden');
                playIcon.classList.remove('hidden');
                playPauseText.textContent = 'Reanudar';
                clearTimeout(melodyTimer);
            } else {
                pauseIcon.classList.remove('hidden');
                playIcon.classList.add('hidden');
                playPauseText.textContent = 'Pausar';
                if (audioEnabled) scheduleNextNote();
            }
        });

        musicBtn.addEventListener('click', toggleMusic);

        // Iniciar la presentación al cargar la página
        window.addEventListener('load', () => {
            startPresentationSequence();
            requestAnimationFrame(animate);
        });
    </script>
</body>
</html>
